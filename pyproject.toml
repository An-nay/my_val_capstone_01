[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "my_val_capstone_01"
version = "0.0.1"
description = "Machine learning and LLM experimentation for personalised insurance guidance and next-category prediction using myVal data."
authors = [
  { name = "Fabian Moreno Cruz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "fastapi>=0.141.1",
    "joblib",
    "loguru",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "ipython",
    "jupyterlab",
    "matplotlib",
    "mkdocs",
    "notebook",
    "openpyxl>=3.1.5",
    "pip",
    "pytest",
    "ruff",
    "tqdm",
    "typer",
    "uvicorn>=0.54.0",
]


[tool.ruff]
line-length = 99
src = ["my_val_capstone_01"]
include = ["pyproject.toml", "my_val_capstone_01/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["my_val_capstone_01"]
force-sort-within-sections = true

