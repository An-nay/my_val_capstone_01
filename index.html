<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myVal · Next-category recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2F4F0;--card:#FFFFFF;--ink:#14232B;--mute:#5E6E73;--line:#D9DFDA;--sea:#0F6B66;--sea-2:#D7EBE6;--gold:#E6A817;--bad:#B3261E;
--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{padding:28px clamp(16px,4vw,48px) 8px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,40px);font-weight:700;line-height:1.05;max-width:16ch}
header p{margin:0;max-width:44ch;color:var(--mute)}
.presets{display:flex;gap:8px;flex-wrap:wrap;padding:8px clamp(16px,4vw,48px) 0}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:500 14px var(--body);color:var(--ink);cursor:pointer}
.presets button:hover{border-color:var(--sea);color:var(--sea)}
.presets button.active{background:var(--sea);border-color:var(--sea);color:#fff}
.pid{padding:8px clamp(16px,4vw,48px) 0;color:var(--mute);font-size:13px}.pid:empty{display:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px 340px;gap:24px;padding:20px clamp(16px,4vw,48px) 56px;align-items:start}
@media(max-width:1260px){main{grid-template-columns:minmax(0,1fr) 380px}#form{grid-row:1 / span 2}#side{grid-column:2}}
@media(max-width:960px){main{grid-template-columns:1fr}#form{grid-row:auto}#side{grid-column:auto}.result{position:static!important}}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
section.panel>h2{font-size:19px;margin-bottom:2px}.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
details.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
details.panel summary{cursor:pointer;padding:16px 22px;font:700 17px var(--display);list-style:none;display:flex;justify-content:space-between}
details.panel summary::after{content:"+";color:var(--sea);font-size:20px}details[open].panel summary::after{content:"–"}
details.panel .body{padding:0 22px 20px}
.shelf{width:100%;border-collapse:collapse}
.shelf th{font:500 13px var(--body);color:var(--mute);text-align:left;padding:0 0 6px}
.shelf td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.shelf th.ai,.shelf td.ai{text-align:right;padding-left:28px;white-space:nowrap}.shelf td.ai{font-weight:600}
.shelf td:first-child{font-weight:600}.shelf td:first-child small{display:block;color:var(--mute);font-weight:400}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:34px;height:34px;border:0;background:var(--paper);font-size:18px;cursor:pointer;color:var(--ink)}
.step button:hover{background:var(--sea-2)}
.step input{width:46px;text-align:center;border:0;font:600 15px var(--body);height:34px;background:#fff;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:14px}
.f input[type=number],.f select{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:400 15px var(--body);background:#fff;color:var(--ink);width:100%}
.f input[type=range]{accent-color:var(--sea);width:100%}.f output{color:var(--sea);font-weight:600}
.f.chk{flex-direction:row;align-items:center;gap:8px;height:38px;align-self:end}.f.chk input{width:18px;height:18px;accent-color:var(--sea)}
.result{position:sticky;top:16px;background:var(--ink);color:#F2F4F0;border-radius:18px;padding:24px}
.result h2{font-size:15px;font-weight:500;color:#A9BDBB;font-family:var(--body)}
.pick{font:700 clamp(34px,4.5vw,46px)/1.05 var(--display);margin:6px 0 2px;overflow-wrap:anywhere}
.pick-p{color:var(--gold);font:600 18px var(--body)}
.rank{margin-top:22px;border-top:1px solid #2F4650;padding-top:16px}
.row{margin-bottom:14px}.row div.t{display:flex;justify-content:space-between;font-weight:500;margin-bottom:5px}
.bar{height:10px;background:#28404A;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.row:nth-child(n+2) .bar i{background:#6FC2B9}
.note{color:#A9BDBB;font-size:13px;margin:16px 0 0}
.err{background:#3A1F1D;border:1px solid var(--bad);border-radius:10px;padding:12px;color:#FFD9D5;font-size:14px}
.busy{opacity:.55;transition:opacity .2s}
.items{list-style:none;margin:0;padding:0}.items li{display:flex;justify-content:space-between;gap:16px;padding:2px 0;font-size:14px}.items li span:last-child{color:var(--mute);white-space:nowrap}.items em{color:var(--sea);font-style:normal;font-size:12px}.none{color:var(--mute);font-size:14px}.f b{font-weight:600;font-size:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.notif{margin-top:22px;border-top:1px solid #28404A;padding-top:18px}
#side .notif:first-child{margin-top:0;border-top:0;padding-top:0}
.card{background:#1d333c;border:1px solid #28404A;border-radius:12px;padding:14px}
.card b.h{display:block;font:700 17px var(--display);margin-bottom:4px}.msg{font-size:16px;line-height:1.45}
.pill{display:inline-block;background:#28404A;border-radius:99px;padding:2px 10px;font-size:12px;margin:0 6px 0 0}
.sub2{color:#A9BDBB;font-size:12.5px}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.vrow b{font:600 20px var(--display)}
.valrow{display:flex;align-items:center;gap:8px;margin:12px 0 4px}.valrow label{font-size:13px;color:#C9D6D4}
.valrow input{height:38px;width:130px;border:1px solid #3a5560;border-radius:9px;padding:0 10px;font:600 16px var(--body);background:#142a33;color:#fff}
.btns{display:flex;gap:10px;margin-top:12px}.btns button{border:0;border-radius:10px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.btns .yes{background:#0F6B66;color:#fff}.btns .yes:hover{background:#13857f}.btns .no{background:#28404A;color:#E8EFEE}.btns .no:hover{background:#34535f}
.linkbtn{background:none;border:0;color:#6FC2B9;text-decoration:underline;cursor:pointer;font:500 13px var(--body);padding:0;margin-top:8px}
header{position:relative;padding-top:56px}
.switch{position:absolute;top:14px;right:clamp(16px,4vw,48px);display:flex;align-items:center;gap:10px;font:500 13px var(--body);color:var(--mute);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--sea)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <label class="switch" title="Show the fields hidden for customers"><input type="checkbox" id="techswitch"><span class="track"></span>Show technical details</label>
  <h1>What should this household document next?</h1>
  <p>Describe a household in myVal. The trained models rank the categories most likely to be worth capturing next, and update as you edit.</p>
</header>
<div class="presets" id="presets" aria-label="Example households"></div>
<div class="pid" id="pid"></div>
<main>
  <div id="form"></div>
  <aside class="result" id="result" aria-live="polite"><h2>Recommendation</h2><p class="note">Loading…</p></aside>
  <aside class="result" id="side" aria-live="polite"></aside>
</main>

<script>
// Everything below that describes a household comes from the dataset: modeling/build_demo_households.py writes
// models/demo_households.json and the server returns it at /api/households.
let LABELS={},CATS=[],OPT={},HOUSEHOLDS={},S={},ITEMS=[],REG=null,HOLD=null;   // category names, category ids, dropdown options, example households, features, logged items
const nice = s => s.replace(/_/g," ").replace(/-/g," ");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = v => v==null ? "no value recorded" : "A$"+Math.round(v).toLocaleString("en-AU");
let SHOW_ALL = false;   // switch in the top-right corner: category codes, "AI detected", value totals and evidence rating

const $ = s => document.querySelector(s);
const el = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};

function num(k,label,min,max,step=1){return `<label class="f">${label}<input type="number" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}"></label>`}
function sel(k){const blank=S[k]==null||S[k]==="";return `<label class="f">${nice(k)}<select data-k="${k}">${blank?`<option value="" selected>not recorded</option>`:""}${OPT[k].map(o=>`<option ${S[k]===o?"selected":""}>${o}</option>`).join("")}</select></label>`}
function rng(k,label,min,max,step){return `<label class="f">${label} <output>${S[k]}</output><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}"></label>`}
function chk(k,label){return `<label class="f chk"><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}>${label}</label>`}
function build(){
 $("#form").innerHTML = `
 <section class="panel"><h2>Household inventory</h2><p class="sub">${SHOW_ALL?"The items documented in each category, and how many the myVal AI has detected.":"The items documented in each category."}</p>
  <table class="shelf"><thead><tr><th>Category</th><th>Items logged</th>${SHOW_ALL?"<th class='ai'>AI detected</th>":""}</tr></thead><tbody>
  ${CATS.map(c=>{const list=ITEMS.filter(i=>i.category_id===c),n=`${list.length} item${list.length===1?"":"s"}`;
   return `<tr><td>${SHOW_ALL?`${c}<small>${esc(LABELS[c])} · ${n}</small>`:`${esc(LABELS[c])}<small>${n}</small>`}</td>
    <td>${list.length?`<ul class="items">${list.map(i=>`<li><span>${esc(i.name)}${i.added?` <em>added just now</em>`:""}</span><span>${money(i.value)}</span></li>`).join("")}</ul>`:`<span class="none">Nothing logged yet</span>`}</td>
    ${SHOW_ALL?`<td class="ai">${S["ai_count_"+c]}</td>`:""}</tr>`}).join("")}
  </tbody></table>
  ${SHOW_ALL?`<div class="grid" style="margin-top:16px"><div class="f">Documented value (AUD)<b>${money(S.documented_value_total)}</b></div><div class="f">Replacement cost (AUD)<b>${money(S.documented_replacement_cost_total)}</b></div><div class="f">Mean evidence rating<b>${(+S.mean_evidence_rating).toFixed(2)}</b></div></div>`:""}</section>
 ${SHOW_ALL?`<details class="panel"><summary>AI analysis</summary><div class="body"><div class="grid">
  ${rng("ai_category_match_rate","AI category match rate",0,1,.05)}${rng("ai_suggestion_acceptance_rate","Suggestions accepted",0,1,.05)}
  ${num("ai_estimated_value_total","AI value, total (AUD)",0,1e7,100)}${num("ai_estimated_value_mean","AI value, mean (AUD)",0,1e6,50)}${num("ai_estimated_value_max","AI value, max (AUD)",0,1e6,50)}</div></div></details>
 <details class="panel" open><summary>Property</summary><div class="body"><div class="grid">
  ${sel("Property_Type")}${sel("Occupancy_Type")}${num("Number_Of_Occupants","Occupants",1,15)}${num("Number_Of_Bedrooms","Bedrooms",0,15)}${num("Property_Valuation_AUD","Valuation (AUD)",0,5e7,1000)}
  ${sel("Insurance_Coverage_Type")}${rng("Insurance_Confidence_1_5","Insurance confidence",1,5,1)}${chk("Is_Home_Insured","Home is insured")}</div></div></details>
 <details class="panel"><summary>Customer</summary><div class="body"><div class="grid">
  ${["Age_Band","Gender","State","Occupation","Household_Type","Income_Band","Financial_Literacy_Band","Engagement_Tier","Membership_Level","Account_Status","Preferred_Channel","Preferred_Explanation_Style","Prior_Claim_Experience","Underinsurance_Awareness"].map(sel).join("")}
  ${num("Tenure_Months","Tenure (months)",0,240)}${chk("Is_Primary","Primary account holder")}${chk("Notification_Opt_In","Notifications on")}</div></div></details>
 <details class="panel"><summary>Property video</summary><div class="body"><div class="grid">
  ${num("video_count","Videos uploaded",0,50)}${num("total_video_duration_seconds","Total duration (s)",0,1e5,10)}${num("mean_video_duration_seconds","Mean duration (s)",0,1e4,10)}${num("total_rooms_covered","Rooms covered",0,50)}${num("total_items_detected","Items detected",0,500)}</div></div></details>`:""}`;
}

let CURRENT=null;   // the example household that was loaded last
function markPreset(){   // highlight the chosen button; with the technical switch on, also show its property id
 document.querySelectorAll("#presets button").forEach(b=>{const on=b.dataset.p===CURRENT;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on)});
 $("#pid").textContent=SHOW_ALL&&CURRENT?`Property ID: ${HOUSEHOLDS[CURRENT].property_id}`:"";
}
function loadHousehold(name){const h=HOUSEHOLDS[name];S={...h.features};ITEMS=h.items.map(i=>({...i}));CURRENT=name;markPreset()}
$("#presets").addEventListener("click",e=>{const p=e.target.dataset.p;if(p){loadHousehold(p);SUGGESTING=true;build();run()}});

$("#techswitch").addEventListener("change",e=>{SHOW_ALL=e.target.checked;build();markPreset()});

$("#form").addEventListener("input",e=>{
 const t=e.target,k=t.dataset.k;if(!k)return;
 S[k]=t.type==="checkbox"?(k==="Is_Home_Insured"?+t.checked:t.checked):(t.type==="number"||t.type==="range"?(t.value===""?0:+t.value):t.value);
 if(t.type==="range")t.parentElement.querySelector("output").textContent=t.value;
 run();
});

// ---- household value card: the regression's estimate against what has been logged (needs 10+ valued items)
function valueCard(j){
 const money=v=>"A$"+Math.round(v).toLocaleString("en-AU");
 const counted=ITEMS.filter(i=>i.category!=="Vehicles"&&i.value!=null&&i.value===i.value);
 const c=j.value_cap,logged=c?c.logged:counted.reduce((a,i)=>a+i.value,0);
 let body;
 if(c){
  const pct=c.estimate>0?Math.min(100,logged/c.estimate*100):0;
  body=`<div class="vrow"><span>Estimated household total</span><b>${money(c.estimate)}</b></div>
   <div class="sub2">${REG?Math.round(REG.confidence_level*100)+"% range":"Range"} ${money(c.lower)} to ${money(c.upper)}, estimated from the first ${c.n_documented} items</div>
   <div class="vrow" style="margin-top:14px"><span>Logged so far</span><b>${money(logged)}</b></div>
   <div class="bar" style="margin-top:8px"><i style="width:${Math.max(2,pct)}%;background:#6FC2B9"></i></div>
   <div class="sub2" style="margin-top:6px">${logged>=c.estimate?"You have reached the estimate.":`${pct.toFixed(0)}% of the estimate, ${money(c.headroom)} to go.`}</div>`;
 }else{
  body=`<div class="vrow"><span>Logged so far</span><b>${money(logged)}</b></div>
   <div class="sub2" style="margin-top:8px">${!REG?`The household total is not available.`:counted.length<REG.min_items?`The household total is estimated once ${REG.min_items} items with a value are logged (${counted.length} so far).`:`The household total could not be estimated for this household (${counted.length} items with a value are logged).`}</div>`;
 }
 return `<div class="notif"><h2>Household value</h2><div style="height:10px"></div><div class="card">${body}</div></div>`;
}

// ---- next-item suggestions, fed by the recommender (the only addition to this page)
let LAST=null,SUGGESTING=true;
function notifCard(j){
 const sg=j.suggestion,pct=x=>(x*100).toFixed(1)+"%";let body;
 if(!SUGGESTING){body=`<b class="h">Okay, we'll stop asking</b><div class="msg">You can keep editing the household on the left.</div><button type="button" class="linkbtn" id="askagain">Start suggestions again</button>`}
 else if(sg.done){body=`<b class="h">That's everything we'd suggest</b><div class="msg">${sg.message}</div>`}
 else{
  const tag=sg.stage==="new_category"?`New category, recommender confidence ${pct(sg.probability)}`:`More ${sg.category.toLowerCase()}, you have ${sg.have} (typical ${sg.typical})`;
  body=`<span class="pill">${tag}</span><div class="msg" style="margin-top:8px">${sg.message}</div>
   <div class="valrow"><label for="sugname">Item name (optional)</label><input type="text" id="sugname" maxlength="60" placeholder="e.g. what is it?" style="width:190px;font-weight:500"></div>
   <div class="valrow"><label for="sugval">Estimated value (AUD)</label><input type="number" id="sugval" min="0" step="10" value="${Math.round(sg.suggested_value)}"></div>
   <div class="sub2">${sg.stage==="new_category"?"This is the typical value of the first item people log in this category.":"This is a typical value for items in this category."} Change it if yours is different.</div>
   <div class="btns"><button type="button" class="yes" id="logyes">Yes, log it</button><button type="button" class="no" id="logno">No thanks</button></div>`;
 }
 return `<div class="notif"><h2>Next item to log</h2><div style="height:10px"></div><div class="card">${body}</div></div>`;
}
$("#side").addEventListener("click",async e=>{
 if(e.target.id==="logyes"&&LAST&&LAST.suggestion&&!LAST.suggestion.done){
  const v=parseFloat($("#sugval").value);if(!(v>=0))return;
  const r=await fetch("/api/log-item",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({features:S,category:LAST.suggestion.category,value:v})});
  const j=await r.json();if(!r.ok)return;
  const cat=LAST.suggestion.category,id=CATS.find(c=>LABELS[c]===cat),nm=($("#sugname").value||"").trim();
  ITEMS.push({name:nm||`${cat} item`,category:cat,category_id:id,value:v,added:true});
  Object.assign(S,j.features);build();clearTimeout(timer);predict();return}
 if(e.target.id==="logno"){SUGGESTING=false;if(LAST)show(LAST);return}
 if(e.target.id==="askagain"){SUGGESTING=true;if(LAST)show(LAST)}
});
let timer,seq=0;
function run(){clearTimeout(timer);$("#result").classList.add("busy");$("#side").classList.add("busy");timer=setTimeout(predict,220)}
async function predict(){
 const id=++seq;
 try{
  const r=await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...S,items:ITEMS.map(i=>({category:i.category,value:i.value}))})});
  const j=await r.json();if(id!==seq)return;
  if(!r.ok)throw new Error(j.detail||"Prediction failed");
  LAST=j;show(j);
 }catch(err){if(id===seq){$("#side").innerHTML="";$("#result").innerHTML=`<h2>Recommendation</h2><div class="err"><b>Couldn't get a prediction.</b><br>${String(err.message).replace(/</g,"&lt;")}<br>Check that the server is running and try again.</div>`}}
 $("#result").classList.remove("busy");$("#side").classList.remove("busy");
}
function show(j){
 const pct=x=>(x*100).toFixed(1)+"%",top=j.top_3[0];
 const sg=j.suggestion,fresh=sg&&sg.stage==="new_category";   // the best category not yet documented, the same one the card asks about
 $("#result").innerHTML=`<h2>${fresh?"Most likely next category to document":"Most likely next category"}</h2>
  <div class="pick">${fresh?sg.category:j.top_1.category}</div>
  <div class="rank"><h2>Ranked shortlist</h2><div style="height:12px"></div>
  ${j.top_3.map(r=>`<div class="row"><div class="t"><span>${r.category}</span><span>${pct(r.probability)}</span></div><div class="bar"><i style="width:${Math.max(2,r.probability*100)}%"></i></div></div>`).join("")}</div>
  <p class="note">The single pick comes from one model and the shortlist from another, so they can differ. The shortlist is the more reliable of the two: the true next category was in the top 2${HOLD?` about ${Math.round(HOLD.top_2*100)}% of the time`:""} in the author's holdout test. This is a prototype, not a verdict.</p>
`;
 $("#side").innerHTML=`${valueCard(j)}
  ${notifCard(j)}`;
}
fetch("/api/households").then(r=>r.json()).then(d=>{
 LABELS=d.labels;CATS=Object.keys(LABELS);OPT=d.options;HOUSEHOLDS=d.households;REG=d.regression;HOLD=d.holdout;
 $("#presets").innerHTML=Object.keys(HOUSEHOLDS).map(n=>`<button type="button" data-p="${n}">${n}</button>`).join("");
 loadHousehold("Typical household");build();run();
}).catch(err=>{$("#result").innerHTML=`<h2>Recommendation</h2><div class="err"><b>Couldn't load the households.</b><br>${esc(err.message)}<br>Run modeling/build_demo_households.py and restart the server.</div>`});
</script>
</body>
</html>
